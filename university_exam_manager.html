<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학생 시험 관리 매니저</title>
    <!-- Tailwind CSS CDN for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyTheme: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-sky-600 to-sky-500 text-white shadow-md py-6 px-4 mb-6">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">대학생 시험 관리 매니저</h1>
            <p class="text-sky-100 text-sm sm:text-base">막막한 시험 공부, 중요도와 D-Day를 분석해 오늘 해야 할 순서를 정해드려요!</p>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 w-full flex-grow mb-12 space-y-6">

        <!-- Top Priority Highlight Card (Featured Box) -->
        <section id="topPrioritySection" class="bg-gradient-to-br from-sky-50 to-white border-2 border-sky-400 rounded-2xl p-5 sm:p-6 shadow-sm transition-all">
            <div class="flex items-center justify-between mb-3">
                <span class="bg-sky-600 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">오늘의 원픽 학습</span>
                <span id="topDdayBadge" class="text-xs font-bold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-full">--</span>
            </div>
            <div id="topPriorityContent">
                <p class="text-slate-500 text-sm">등록된 시험 일정이 없습니다. 아래에서 수업을 추가해보세요!</p>
            </div>
        </section>

        <!-- Grid Layout for Input and List -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- Left Column: Input Form (5 Cols on md) -->
            <div class="md:col-span-5 bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-sky-800 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    새 수업 및 시험 등록
                </h2>
                
                <form id="studyForm" class="space-y-4" novalidate>
                    <!-- Class Name -->
                    <div>
                        <label for="className" class="block text-xs font-semibold text-slate-600 mb-1">수업명</label>
                        <input type="text" id="className" placeholder="예: 운영체제" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition-all" autocomplete="off">
                        <p id="nameError" class="text-rose-500 text-xs mt-1 hidden">수업명을 올바르게 입력해주세요.</p>
                    </div>

                    <!-- Category -->
                    <div>
                        <label for="classType" class="block text-xs font-semibold text-slate-600 mb-1">이수구분</label>
                        <select id="classType" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
                            <option value="전공">전공</option>
                            <option value="교양">교양</option>
                            <option value="마이크로디그리">마이크로디그리</option>
                            <option value="비교과">비교과</option>
                        </select>
                    </div>

                    <!-- Difficulty -->
                    <div>
                        <label for="difficulty" class="block text-xs font-semibold text-slate-600 mb-1">난이도 판단</label>
                        <select id="difficulty" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
                            <option value="3">상 (어려움 / 점수 3)</option>
                            <option value="2" selected>중 (보통 / 점수 2)</option>
                            <option value="1">하 (쉬움 / 점수 1)</option>
                        </select>
                    </div>

                    <!-- Exam Date -->
                    <div>
                        <label for="examDate" class="block text-xs font-semibold text-slate-600 mb-1">시험 일자</label>
                        <input type="date" id="examDate" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
                        <p id="dateError" class="text-rose-500 text-xs mt-1 hidden">올바른 시험 일자를 선택해주세요.</p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-4 rounded-xl text-sm transition-colors shadow-sm cursor-pointer">
                        등록하기
                    </button>
                </form>
            </div>

            <!-- Right Column: Registered List & Queue (7 Cols on md) -->
            <div class="md:col-span-7 space-y-6">
                <!-- Sorted Recommendations List -->
                <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-sky-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"></path></svg>
                        스마트 공부 순서 추천
                    </h2>
                    <div id="recommendationList" class="space-y-3 max-h-[360px] overflow-y-auto pr-1">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- All Classes Overview -->
                <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center justify-between">
                        <span>등록된 전체 과목</span>
                        <span id="totalCount" class="text-xs font-normal bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">0개 과목</span>
                    </h2>
                    <div id="classList" class="space-y-2.5 max-h-[250px] overflow-y-auto pr-1">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-6 border-t border-slate-200 mt-auto">
        &copy; 시험 관리 매니저 - 브라우저 로컬 저장소를 활용한 웹 애플리케이션
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // LocalStorage Key
        const STORAGE_KEY = 'exam_manager_subjects_v1';

        // Load saved data or initialize empty array
        let subjects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // DOM elements
        const studyForm = document.getElementById('studyForm');
        const classNameInput = document.getElementById('className');
        const classTypeSelect = document.getElementById('classType');
        const difficultySelect = document.getElementById('difficulty');
        const examDateInput = document.getElementById('examDate');
        
        const nameError = document.getElementById('nameError');
        const dateError = document.getElementById('dateError');
        
        const recommendationList = document.getElementById('recommendationList');
        const classList = document.getElementById('classList');
        const totalCount = document.getElementById('totalCount');
        
        const topPriorityContent = document.getElementById('topPriorityContent');
        const topDdayBadge = document.getElementById('topDdayBadge');

        // Initialize default date to today
        const todayStr = new Date().toISOString().split('T')[0];
        examDateInput.min = todayStr;
        examDateInput.value = todayStr;

        // Form Submission Event
        studyForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = classNameInput.value.trim();
            const type = classTypeSelect.value;
            const difficulty = parseInt(difficultySelect.value, 10);
            const examDate = examDateInput.value;

            // Validation checks
            let isValid = true;
            if (!name) {
                nameError.classList.remove('hidden');
                isValid = false;
            } else {
                nameError.classList.add('hidden');
            }

            if (!examDate) {
                dateError.classList.remove('hidden');
                isValid = false;
            } else {
                dateError.classList.add('hidden');
            }

            if (!isValid) return;

            // Create new subject item
            const newSubject = {
                id: Date.now(),
                name,
                type,
                difficulty,
                examDate
            };

            subjects.push(newSubject);
            persistAndRender();

            // Reset inputs
            classNameInput.value = '';
            examDateInput.value = todayStr;
            classNameInput.focus();
        });

        // Save to localStorage and refresh UI
        function persistAndRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
            renderAll();
        }

        // Calculate D-Day string from date
        function getDDayInfo(dateString) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const target = new Date(dateString);
            target.setHours(0, 0, 0, 0);

            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return { text: 'D-Day', days: 0, urgent: true };
            if (diffDays > 0) return { text: `D-${diffDays}`, days: diffDays, urgent: diffDays <= 3 };
            return { text: `D+${Math.abs(diffDays)} (종료)`, days: diffDays, urgent: false };
        }

        // Compute priority score based on rule:
        // Type weight: Major (3.5), Micro-degree (2.5), Liberal Arts (2.0), Extracurricular (1.0)
        // Difficulty weight: 1 to 3
        // Urgency weight: closer exam date gives exponential priority boost
        function calculateScores() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            return subjects.map(sub => {
                const target = new Date(sub.examDate);
                target.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

                let typeWeight = 2.0;
                if (sub.type === '전공') typeWeight = 3.5;
                else if (sub.type === '마이크로디그리') typeWeight = 2.5;
                else if (sub.type === '비교과') typeWeight = 1.0;

                // Urgency score component (lower remaining days -> higher score)
                let urgencyScore = 0;
                if (diffDays <= 0) {
                    urgencyScore = 50; // Past or today is highest urgency
                } else {
                    urgencyScore = Math.max(0, 30 - (diffDays * 2.5));
                }

                // Total weighted score
                const totalScore = typeWeight + sub.difficulty + urgencyScore;

                return {
                    ...sub,
                    diffDays,
                    score: totalScore
                };
            }).sort((a, b) => b.score - a.score); // Descending order
        }

        // Master render function
        function renderAll() {
            totalCount.textContent = `${subjects.length}개 과목`;
            
            if (subjects.length === 0) {
                topPriorityContent.innerHTML = `<p class="text-slate-400 text-sm">등록된 시험 일정이 없습니다. 좌측에서 과목을 추가해주세요.</p>`;
                topDdayBadge.textContent = '--';
                recommendationList.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">추천할 공부 순서가 없습니다.</div>`;
                classList.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">등록된 과목이 없습니다.</div>`;
                return;
            }

            const scoredList = calculateScores();
            const topItem = scoredList[0];
            const topDday = getDDayInfo(topItem.examDate);

            // Render Top Priority Banner (1st place highlight)
            topDdayBadge.textContent = topDday.text;
            topPriorityContent.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-200 text-sky-800">${topItem.type}</span>
                            <span class="text-xs text-slate-500">난이도: ${topItem.difficulty === 3 ? '상' : (topItem.difficulty === 2 ? '중' : '하')}</span>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">${escapeHtml(topItem.name)}</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-500 block">시험일자: ${topItem.examDate}</span>
                        <span class="text-xs font-semibold text-sky-700 bg-sky-100 px-2 py-1 rounded-md inline-block mt-1">오늘 집중 학습 대상 🚀</span>
                    </div>
                </div>
            `;

            // Render Recommendation List
            recommendationList.innerHTML = '';
            scoredList.forEach((item, index) => {
                const dday = getDDayInfo(item.examDate);
                const isFirst = index === 0;

                const div = document.createElement('div');
                div.className = `p-3.5 rounded-xl border transition-all flex items-center justify-between ${
                    isFirst ? 'bg-sky-50/80 border-sky-300 shadow-sm' : 'bg-slate-50 border-slate-200'
                }`;

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                            isFirst ? 'bg-sky-600 text-white' : 'bg-slate-200 text-slate-700'
                        }">${index + 1}</span>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm ${isFirst ? 'text-sky-900 font-extrabold text-base' : 'text-slate-800'}">
                                    ${escapeHtml(item.name)}
                                </span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">${item.type}</span>
                            </div>
                            <div class="text-xs text-slate-500 mt-0.5">
                                시험일: ${item.examDate} (<span class="font-semibold text-rose-500">${dday.text}</span>) | 난이도: ${item.difficulty === 3 ? '상' : (item.difficulty === 2 ? '중' : '하')}
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-slate-600">${Math.round(item.score)}점</span>
                    </div>
                `;
                recommendationList.appendChild(div);
            });

            // Render Complete List for Management & Deletion
            classList.innerHTML = '';
            subjects.forEach(sub => {
                const dday = getDDayInfo(sub.examDate);
                let badgeColor = 'bg-slate-100 text-slate-700';
                if (sub.type === '전공') badgeColor = 'bg-sky-100 text-sky-800';
                else if (sub.type === '마이크로디그리') badgeColor = 'bg-amber-100 text-amber-800';
                else if (sub.type === '교양') badgeColor = 'bg-indigo-100 text-indigo-800';

                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-3 rounded-xl border border-slate-200 bg-white flex items-center justify-between text-sm';
                itemDiv.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2 py-0.5 rounded font-medium ${badgeColor}">${sub.type}</span>
                            <span class="font-semibold text-slate-800">${escapeHtml(sub.name)}</span>
                        </div>
                        <div class="text-xs text-slate-500">
                            시험일: ${sub.examDate} (${dday.text})
                        </div>
                    </div>
                    <button onclick="deleteSubject(${sub.id})" class="text-xs text-rose-500 hover:text-rose-700 font-semibold px-2.5 py-1.5 rounded-lg hover:bg-rose-50 transition-colors cursor-pointer">
                        삭제
                    </button>
                `;
                classList.appendChild(itemDiv);
            });
        }

        // Delete subject function exposed globally
        window.deleteSubject = function(id) {
            subjects = subjects.filter(sub => sub.id !== id);
            persistAndRender();
        }

        // XSS sanitization helper
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Initial render on load
        renderAll();
    </script>
</body>
</html>
